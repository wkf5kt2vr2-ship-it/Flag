<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎂 生日快乐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">

<!-- Three.js r128 + post-processing -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Noto Sans SC','PingFang SC',sans-serif}

/* Two rendering canvases */
#gl-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#p2d-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:none}

#webcam{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;top:0;left:0}
#photo-ring{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}

/* ── Landing ── */
#landing{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(0,40,80,.97) 0%,rgba(5,5,15,.99) 100%)}
#landing h1{font-size:clamp(2.8rem,7vw,5.5rem);font-weight:900;letter-spacing:.22em;color:#00ffff;text-shadow:0 0 18px #00ffff,0 0 40px #00ffff,0 0 80px rgba(0,255,255,.45);margin-bottom:.5rem;animation:glow-pulse 2.4s ease-in-out infinite}
#landing p{font-size:clamp(.9rem,1.8vw,1.1rem);color:rgba(0,255,255,.55);letter-spacing:.12em;margin-bottom:3rem}
#start-btn{font-family:inherit;font-size:clamp(1rem,2vw,1.35rem);font-weight:700;letter-spacing:.25em;color:#05050f;background:#00ffff;border:none;padding:.9rem 3rem;border-radius:50px;cursor:pointer;transition:transform .25s,box-shadow .25s;box-shadow:0 0 20px #00ffff,0 0 45px rgba(0,255,255,.4)}
#start-btn:hover{transform:scale(1.06);box-shadow:0 0 30px #00ffff,0 0 70px rgba(0,255,255,.55)}
#start-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

/* ── Loader ── */
#loader{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;pointer-events:none}
#loader-card{background:rgba(5,5,20,.92);border:1px solid rgba(0,255,255,.25);border-radius:18px;padding:2rem 2.5rem;min-width:300px;max-width:88vw;box-shadow:0 0 40px rgba(0,255,255,.12),0 0 80px rgba(0,0,0,.6);backdrop-filter:blur(8px);transform:translateY(8px);opacity:0;transition:opacity .4s,transform .4s}
#loader-card.visible{opacity:1;transform:translateY(0)}
#loader-title{text-align:center;font-size:1rem;letter-spacing:.22em;color:rgba(0,255,255,.7);margin-bottom:1.6rem;font-weight:700}
.loader-step{display:flex;align-items:center;gap:.75rem;margin-bottom:.85rem;font-size:.88rem;letter-spacing:.06em;color:rgba(255,255,255,.35);transition:color .35s}
.loader-step.active{color:rgba(255,255,255,.95)}.loader-step.done{color:rgba(0,255,255,.7)}
.step-icon{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0;transition:border-color .35s,background .35s}
.loader-step.active .step-icon{border-color:#00ffff;animation:spin-ring 1.2s linear infinite}
.loader-step.done .step-icon{border-color:#00ffff;background:rgba(0,255,255,.15)}
@keyframes spin-ring{0%{box-shadow:2px 0 0 #00ffff}25%{box-shadow:0 2px 0 #00ffff}50%{box-shadow:-2px 0 0 #00ffff}75%{box-shadow:0 -2px 0 #00ffff}100%{box-shadow:2px 0 0 #00ffff}}
#loader-bar-wrap{margin:1.3rem 0 .7rem;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
#loader-bar{height:100%;width:0%;background:linear-gradient(90deg,#00ffff,#ff00ff);border-radius:2px;transition:width .6s ease;box-shadow:0 0 8px #00ffff}
#loader-tip{font-size:.75rem;color:rgba(255,255,255,.28);text-align:center;letter-spacing:.05em;min-height:1.1rem}

/* ── Cursor ── */
#cursor{position:fixed;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#00ffff 35%,rgba(0,255,255,.2) 65%,transparent 100%);box-shadow:0 0 8px #00ffff,0 0 18px #00ffff,0 0 40px rgba(0,255,255,.4);pointer-events:none;z-index:200;transform:translate(-50%,-50%);display:none;transition:width .08s,height .08s}
#cursor.pinching{width:14px;height:14px;background:radial-gradient(circle,#fff 0%,#ff00ff 40%,transparent 100%);box-shadow:0 0 8px #ff00ff,0 0 20px #ff00ff}

/* ── State UIs ── */
.state-ui{position:fixed;z-index:10;pointer-events:none}
#s1-ui{top:0;left:0;right:0;padding:1.8rem;text-align:center}
#s1-ui .bd-text{font-size:clamp(1.8rem,4.5vw,3.5rem);font-weight:900;letter-spacing:.18em;color:#00ffff;text-shadow:0 0 16px #00ffff,0 0 35px #00ffff;animation:glow-pulse 2s ease-in-out infinite}
#s1-ui .hint{font-size:.9rem;color:rgba(0,255,255,.45);margin-top:.4rem;letter-spacing:.08em}
#s2-ui{bottom:1.8rem;left:0;right:0;text-align:center}
#next-btn{display:inline-block;font-size:clamp(1rem,2vw,1.25rem);font-weight:700;letter-spacing:.22em;color:#ff00ff;border:2px solid #ff00ff;padding:.55rem 2.2rem;border-radius:8px;text-shadow:0 0 10px #ff00ff;box-shadow:0 0 14px rgba(255,0,255,.4),inset 0 0 14px rgba(255,0,255,.06);animation:glow-pulse 1.6s ease-in-out infinite}
#s2-hint{font-size:.8rem;color:rgba(0,255,255,.4);margin-top:.5rem}
#s3-ui{bottom:1.8rem;left:0;right:0;text-align:center}
#s3-hint{font-size:.85rem;color:rgba(0,255,255,.4);letter-spacing:.08em}

.hidden{display:none!important}
@keyframes glow-pulse{0%,100%{opacity:1}50%{opacity:.65}}
</style>
</head>
<body>

<!-- Three.js canvas (PHASE0 / S1 / S3) -->
<canvas id="gl-canvas"></canvas>
<!-- Canvas 2D (S2 hand-particles style) -->
<canvas id="p2d-canvas"></canvas>

<video id="webcam" autoplay muted playsinline></video>
<div id="photo-ring"></div>

<div id="landing">
  <h1>🎂 生日礼物</h1>
  <p>一份专属的星光礼盒，为你而来</p>
  <button id="start-btn">开 启 礼 物</button>
</div>

<div id="loader">
  <div id="loader-card">
    <div id="loader-title">✦ 正在开启星光礼盒 ✦</div>
    <div class="loader-step" id="step-1"><div class="step-icon" id="step-1-icon">1</div><span>粒子引擎初始化</span></div>
    <div class="loader-step" id="step-2"><div class="step-icon" id="step-2-icon">2</div><span>请求摄像头权限</span></div>
    <div class="loader-step" id="step-3"><div class="step-icon" id="step-3-icon">3</div><span>加载手势 AI 模型</span></div>
    <div class="loader-step" id="step-4"><div class="step-icon" id="step-4-icon">4</div><span>就绪，启动倒计时</span></div>
    <div id="loader-bar-wrap"><div id="loader-bar"></div></div>
    <div id="loader-tip">初始化中…</div>
  </div>
</div>

<div id="cursor"></div>

<div id="s1-ui" class="state-ui hidden">
  <div class="bd-text">生日快乐 · 祝你开心</div>
  <div class="hint">✋ 捏合手势 → 进入相册星球</div>
</div>
<div id="s2-ui" class="state-ui hidden">
  <div id="next-btn">下 一 步 →</div>
  <div id="s2-hint">🖐 张开扩张球体 · 合拢收缩 · 移动旋转相册 · 捏合「下一步」继续</div>
</div>
<div id="s3-ui" class="state-ui hidden">
  <div id="s3-hint">✨ 烟花绽放中 · 捏合重新开始</div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   SHARED  —  DOM refs, state, input
   ═══════════════════════════════════════════════════════════════════ */
const $glCanvas  = document.getElementById('gl-canvas');
const $p2dCanvas = document.getElementById('p2d-canvas');
const $webcam    = document.getElementById('webcam');
const $landing   = document.getElementById('landing');
const $cursor    = document.getElementById('cursor');
const $s1UI      = document.getElementById('s1-ui');
const $s2UI      = document.getElementById('s2-ui');
const $s3UI      = document.getElementById('s3-ui');
const $nextBtn   = document.getElementById('next-btn');
const $startBtn  = document.getElementById('start-btn');
const $photoRing = document.getElementById('photo-ring');

let state        = 'LANDING';
let transitioning= false;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ── Shared hand state ── */
const hand = { detected:false, cx:0, cy:0, openness:0.5, angle:0, angleDelta:0 };

/* ── Input ── */
let handX=0.5, handY=0.5, isPinching=false, pinchCooldown=0, mouseMode=false;

function updateHandFromLM(lms) {
  const W=innerWidth, H=innerHeight;
  const lx=i=>(1-lms[i].x)*W, ly=i=>lms[i].y*H;
  hand.cx=lx(9); hand.cy=ly(9);
  const wx=lx(0),wy=ly(0);
  const ref=Math.hypot(lx(9)-wx,ly(9)-wy)+1e-6;
  let s=0; for(const t of [4,8,12,16,20]) s+=Math.hypot(lx(t)-wx,ly(t)-wy);
  hand.openness=Math.min(1,Math.max(0,(s/5/ref-1.0)/1.2));
  const na=Math.atan2(ly(12)-wy,lx(12)-wx);
  let d=na-hand.angle; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
  hand.angleDelta=d; hand.angle=na; hand.detected=true;
  handX=hand.cx/W; handY=hand.cy/H;
  $cursor.style.left=hand.cx+'px'; $cursor.style.top=hand.cy+'px';
}

function elemOverlap(a,b){
  const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
  return !(ra.right<rb.left||ra.left>rb.right||ra.bottom<rb.top||ra.top>rb.bottom);
}

function hideAllUI(){
  [$s1UI,$s2UI,$s3UI].forEach(e=>e.classList.add('hidden'));
  $photoRing.style.display='none';
}

/* ── State transitions ── */
function onPinch(){
  if(transitioning) return;
  if(state==='S1'){ transitioning=true; enterS2().finally(()=>transitioning=false); }
  else if(state==='S2'){
    if(elemOverlap($cursor,$nextBtn)){ transitioning=true; enterS3().finally(()=>transitioning=false); }
  }
  else if(state==='S3'){ transitioning=true; enterS1().finally(()=>transitioning=false); }
}

/* ═══════════════════════════════════════════════════════════════════
   THREE.JS  ENGINE  (PHASE0 / S1 / S3)
   ═══════════════════════════════════════════════════════════════════ */
const MAX_P = 4500;

/* ── Renderer / scene ── */
const renderer = new THREE.WebGLRenderer({ canvas:$glCanvas, antialias:false, alpha:false });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);

const scene   = new THREE.Scene();
const camera3 = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera3.position.set(0, 0, 13);

/* ── Bloom post-processing ── */
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera3));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 1.9, 0.55, 0);
composer.addPass(bloom);

/* ── Particle geometry ── */
const posArr = new Float32Array(MAX_P * 3);
const colArr = new Float32Array(MAX_P * 3);
const tgtArr = new Float32Array(MAX_P * 3);
const velArr = new Float32Array(MAX_P * 3);
const burst  = new Uint8Array(MAX_P);

const geom   = new THREE.BufferGeometry();
const posAttr = new THREE.BufferAttribute(posArr, 3); posAttr.setUsage(THREE.DynamicDrawUsage);
const colAttr = new THREE.BufferAttribute(colArr, 3); colAttr.setUsage(THREE.DynamicDrawUsage);
geom.setAttribute('position', posAttr);
geom.setAttribute('color',    colAttr);

const pMat = new THREE.PointsMaterial({ size:0.09, vertexColors:true, transparent:true, opacity:0.9, sizeAttenuation:true });
const pts  = new THREE.Points(geom, pMat);
scene.add(pts);

/* ── Scatter helper ── */
function shapeExplode(mag){
  const a=[];
  for(let i=0;i<MAX_P;i++){
    const th=Math.random()*Math.PI*2, ph=Math.random()*Math.PI;
    const r=mag*(5+Math.random()*8);
    a.push(Math.sin(ph)*Math.cos(th)*r, Math.sin(ph)*Math.sin(th)*r, Math.cos(ph)*r);
  }
  return a;
}

function fill(arr){
  const out=new Float32Array(MAX_P*3);
  const L=arr.length/3|0; if(!L) return out;
  for(let i=0;i<MAX_P;i++){
    const s=i%L; out[i*3]=arr[s*3]; out[i*3+1]=arr[s*3+1]; out[i*3+2]=arr[s*3+2];
  }
  return out;
}

let lerpSpd=0.06;
const LERP_FAST=0.14, LERP_MED=0.08, LERP_SLOW=0.03;
function setTarget(arr, spd=LERP_MED){ tgtArr.set(arr); lerpSpd=spd; burst.fill(0); }

/* ── Colour helpers (per-vertex) ── */
function colorize(fn){
  for(let i=0;i<MAX_P;i++){
    const[r,g,b]=fn(i); colArr[i*3]=r; colArr[i*3+1]=g; colArr[i*3+2]=b;
  }
  colAttr.needsUpdate=true;
}
const rc=arr=>arr[Math.floor(Math.random()*arr.length)];
const COL_WARM=[[1,.63,0],[1,.33,0],[1,.86,.2],[0,1,.7],[1,.51,.1]];
const COL_CELEBRATE=[[0,1,1],[1,0,.78],[1,.69,0],[0,1,.5],[.69,.27,1]];
const COL_DIGIT={
  5:[[0,1,1],[0,.69,1],[.55,.80,1]],
  4:[[.73,.04,1],[.84,.25,1],[.41,0,.84]],
  3:[[1,.73,0],[1,.33,0],[1,.94,.35]],
  2:[[.04,.86,.29],[0,.76,.73],[.31,1,.6]],
  1:[[1,.16,.02],[1,.47,0],[1,.9,.29]],
};

function colWarm(){ colorize(()=>{const[r,g,b]=rc(COL_WARM);return[r,g,b];}); }
function colCelebrate(){ colorize(()=>{const[r,g,b]=rc(COL_CELEBRATE);return[r,g,b];}); }
function colDigit(n){ colorize(()=>{const[r,g,b]=rc(COL_DIGIT[n]||COL_DIGIT[5]);return[r,g,b];}); }

/* ── 7-segment digit (direct Float32Array) ── */
const digitCache={};
function buildDigitShapes(){
  const SEG_MAP={1:[0,1,1,0,0,0,0],2:[1,1,0,1,1,0,1],3:[1,1,1,1,0,0,1],4:[0,1,1,0,0,1,1],5:[1,0,1,1,0,1,1]};
  const W=2.5,H=5.0,G=0.28,TK=0.50;
  const SEGS=[[-W+G,H,W-G,H,true],[W,H-G,W,G,false],[W,-G,W,-H+G,false],[-W+G,-H,W-G,-H,true],[-W,-G,-W,-H+G,false],[-W,H-G,-W,G,false],[-W+G,0,W-G,0,true]];
  for(const[key,on] of Object.entries(SEG_MAP)){
    const n=Number(key), active=on.reduce((s,v)=>s+v,0)||1;
    const out=new Float32Array(MAX_P*3);
    const pps=Math.floor(MAX_P/active); let ptr=0;
    for(let s=0;s<7;s++){
      if(!on[s]) continue;
      const[x1,y1,x2,y2,hz]=SEGS[s];
      const fN=Math.floor(pps*0.55);
      for(let k=0;k<fN;k++){
        const t=Math.random(),p=(Math.random()-.5)*TK*.85,z=.18+(Math.random()-.5)*.12;
        if(hz){out[ptr++]=x1+(x2-x1)*t;out[ptr++]=y1+p;out[ptr++]=z;}
        else{out[ptr++]=x1+p;out[ptr++]=y1+(y2-y1)*t;out[ptr++]=z;}
      }
      for(let k=fN;k<pps;k++){
        const t=Math.random(),p=(Math.random()-.5)*TK*1.25,z=-.18+(Math.random()-.5)*.16;
        if(hz){out[ptr++]=x1+(x2-x1)*t;out[ptr++]=y1+p;out[ptr++]=z;}
        else{out[ptr++]=x1+p;out[ptr++]=y1+(y2-y1)*t;out[ptr++]=z;}
      }
    }
    const wr=(ptr/3)|0;
    if(wr>0) for(let i=wr;i<MAX_P;i++){const s=(i%wr)*3;out[i*3]=out[s]+(Math.random()-.5)*.04;out[i*3+1]=out[s+1]+(Math.random()-.5)*.04;out[i*3+2]=out[s+2];}
    digitCache[n]=out;
  }
}
function shapeDigit(n){ return digitCache[n]??digitCache[1]; }

/* ── Parametric Christmas tree ── */
function shapeTree(){
  const a=[];
  const tiers=[{yBot:-3.6,yTop:-1.3,baseR:3.1},{yBot:-1.8,yTop:0.6,baseR:2.4},{yBot:0.1,yTop:2.0,baseR:1.7},{yBot:1.4,yTop:3.0,baseR:1.1}];
  const ppt=Math.floor(3800/tiers.length);
  for(const{yBot,yTop,baseR} of tiers) for(let i=0;i<ppt;i++){
    const y=yBot+Math.random()*(yTop-yBot),f=(y-yBot)/(yTop-yBot);
    const r=baseR*(1-f*.88)*(.7+Math.random()*.3),th=Math.random()*Math.PI*2;
    a.push(Math.cos(th)*r,y,Math.sin(th)*r);
  }
  for(let i=0;i<280;i++) a.push((Math.random()-.5)*.45,-4.1-Math.random()*.7,(Math.random()-.5)*.45);
  for(let s=0;s<5;s++){
    const a0=s*Math.PI*2/5-Math.PI/2;
    for(let k=0;k<50;k++){const t=k/50;a.push(Math.cos(a0)*t*.65+(Math.random()-.5)*.04,3.25+(Math.random()-.5)*.06,Math.sin(a0)*t*.18+(Math.random()-.5)*.04);}
  }
  for(let i=0;i<140;i++){const ang=Math.random()*Math.PI*2,r=Math.random()*.2;a.push(Math.cos(ang)*r,3.25+(Math.random()-.5)*.1,Math.sin(ang)*r*.3);}
  return a;
}

/* ── S3: birthday text rasterized onto 3D points ── */
async function shapeBirthday(){
  await document.fonts.ready;
  const pts=[];
  for(const[txt,yOff] of [['生日',-.9],['快乐',.9]]){
    const c=Object.assign(document.createElement('canvas'),{width:500,height:180});
    const cx=c.getContext('2d');
    cx.fillStyle='#fff'; cx.font='bold 150px "Noto Sans SC",sans-serif';
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(txt,250,90);
    const px=cx.getImageData(0,0,500,180).data;
    for(let y=0;y<180;y+=4) for(let x=0;x<500;x+=4)
      if(px[(y*500+x)*4+3]>80)
        pts.push((x/500-.5)*9, yOff*3.2+(Math.random()-.5)*.05, (Math.random()-.5)*.3);
  }
  return fill(pts);
}

/* ── Three.js firework (burst system) ── */
function scatter3D(){
  const exp=shapeExplode(1.2);
  for(let i=0;i<MAX_P;i++){
    const i3=i*3;
    const dx=exp[i3]-posArr[i3], dy=exp[i3+1]-posArr[i3+1], dz=exp[i3+2]-posArr[i3+2];
    const spd=0.12+Math.random()*.18;
    const len=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
    velArr[i3]=dx/len*spd; velArr[i3+1]=dy/len*spd; velArr[i3+2]=dz/len*spd;
    burst[i]=1;
  }
}

/* ── Three.js S3 firework sparks (attached to hand position on hitplane) ── */
const mouse3 = new THREE.Vector2();
const raycaster = new THREE.Raycaster();
const hitPlane = new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshBasicMaterial({visible:false,side:THREE.DoubleSide}));
scene.add(hitPlane);
let fwThrottle=0;
let s1RotTarget=0, s1AutoRot=0;

/* ═══════════════════════════════════════════════════════════════════
   CANVAS 2D ENGINE  (S2 only — hand_particles.html style)
   ═══════════════════════════════════════════════════════════════════ */
const ctx2d = $p2dCanvas.getContext('2d');
function resizeP2D(){ $p2dCanvas.width=innerWidth; $p2dCanvas.height=innerHeight; }
resizeP2D();

const PN=2000;
const p2d=[];
const PAL=[[80,160,255],[120,80,255],[0,220,255],[200,100,255],[60,255,200]];
function rcp(){ return PAL[Math.floor(Math.random()*PAL.length)]; }

function mkP2(){
  const cx=innerWidth/2,cy=innerHeight/2,mr=Math.min(cx,cy)*.84;
  const a=Math.random()*Math.PI*2,r=(.12+Math.random()*.68)*mr;
  return{x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,vx:0,vy:0,oA:a,oR:r,oS:(Math.random()-.5)*.005,sz:.8+Math.random()*1.6,col:[...rcp()],ph:Math.random()*Math.PI*2};
}
function initP2D(){ p2d.length=0; for(let i=0;i<PN;i++) p2d.push(mkP2()); }
initP2D();

/* S2 state */
let s2Open=0, s2LastPX=null, s2RotVel=0, s2TotalRot=0, p2dTick=0;
/* S2 3D sphere */
let s2RotX=0, s2RotY=0, s2RotVelX=0, s2RotVelY=0;
let s2PrevHX=0.5, s2PrevHY=0.5;
let s2SphereScale=1.0, s2TargetScale=1.0;
const S2_BASE_R=5.5;

/* S3 state */
let s3AnimId2=null;

/* Photos */
let photoEls=[];
function buildPhotoRing(){
  $photoRing.innerHTML=''; photoEls=[];
  PHOTO_DATA.forEach(pd=>{
    const w=document.createElement('div');
    w.style.cssText='position:absolute;width:115px;height:152px;border:1.5px solid rgba(0,255,255,0.55);border-radius:5px;overflow:hidden;opacity:0;transition:opacity .5s;box-shadow:0 0 14px rgba(0,255,255,0.28);';
    const img=document.createElement('img');
    img.src=pd.src; img.style.cssText='width:100%;height:100%;object-fit:cover;';
    w.appendChild(img); $photoRing.appendChild(w); photoEls.push(w);
  });
}
function positionPhotos(rot){
  const cx=innerWidth/2,cy=innerHeight/2,R=Math.min(cx,cy)*.47;
  photoEls.forEach((el,i)=>{
    const a=(i/photoEls.length)*Math.PI*2+rot;
    el.style.left=(cx+Math.cos(a)*R-57.5)+'px'; el.style.top=(cy+Math.sin(a)*R-76)+'px';
    el.style.transform=`rotate(${(a*180/Math.PI+90).toFixed(1)}deg)`;
  });
}

/* S2 render loop */
let s2AnimId=null;
function s2Animate(){
  s2AnimId=requestAnimationFrame(s2Animate);
  p2dTick++;
  const W=innerWidth,H=innerHeight,cx=W/2,cy=H/2;
  ctx2d.fillStyle='rgba(0,0,0,0.16)'; ctx2d.fillRect(0,0,W,H);

  /* Photo ring update */
  s2Open+=(hand.openness-s2Open)*.09;
  if(hand.detected){
    const px=hand.cx/W;
    if(s2LastPX!==null) s2RotVel+=(px-s2LastPX)*3.2;
    s2LastPX=px;
  }
  s2RotVel*=.93; s2TotalRot+=s2RotVel;
  const photoA=Math.max(0,Math.min(1,(s2Open-.20)/.42));
  photoEls.forEach(el=>el.style.opacity=photoA);
  positionPhotos(s2TotalRot);

  /* Particle physics */
  const ORBIT_SPD=hand.detected?.0003:.0006;
  for(const p of p2d){
    p.oA+=p.oS+ORBIT_SPD;
    const ox=cx+Math.cos(p.oA)*p.oR, oy=cy+Math.sin(p.oA)*p.oR;
    const toOX=(ox-p.x)*.012, toOY=(oy-p.y)*.012;
    if(!hand.detected){
      p.vx+=toOX+(Math.random()-.5)*.15; p.vy+=toOY+(Math.random()-.5)*.15;
    } else {
      const dx=p.x-hand.cx,dy=p.y-hand.cy,d2=dx*dx+dy*dy+1,d=Math.sqrt(d2)+1e-6;
      let fm=0;
      if(hand.openness>.55)      fm=+hand.openness*900/(d2*.04+400);
      else if(hand.openness<.45) fm=-(1-hand.openness)*700/(d2*.03+300);
      p.vx+=(dx/d)*fm; p.vy+=(dy/d)*fm;
      if(Math.abs(hand.angleDelta)>.01){
        const sp=hand.angleDelta*.35;
        p.vx+=-(p.y-cy)*sp; p.vy+=(p.x-cx)*sp;
      }
      p.vx+=(hand.cx-p.x)*.0004; p.vy+=(hand.cy-p.y)*.0004;
      p.vx+=toOX*.3; p.vy+=toOY*.3;
    }
    p.vx*=.91; p.vy*=.91;
    if(p.x<20)   p.vx+=(20-p.x)*.05; if(p.x>W-20) p.vx+=(W-20-p.x)*.05;
    if(p.y<20)   p.vy+=(20-p.y)*.05; if(p.y>H-20) p.vy+=(H-20-p.y)*.05;
    p.x+=p.vx; p.y+=p.vy;
    const spd=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
    const bright=Math.min(1,.55+spd*.06);
    const alpha=.55+Math.sin(p2dTick*.02+p.ph)*.10;
    const[r,g,b]=p.col;
    ctx2d.beginPath(); ctx2d.arc(p.x,p.y,p.sz,0,Math.PI*2);
    ctx2d.fillStyle=`rgba(${Math.round(r*bright)},${Math.round(g*bright)},${Math.round(b*bright)},${alpha.toFixed(2)})`;
    ctx2d.fill();
  }
  /* Hand glow */
  if(hand.detected){
    const gr=30+hand.openness*60;
    const grd=ctx2d.createRadialGradient(hand.cx,hand.cy,0,hand.cx,hand.cy,gr);
    grd.addColorStop(0,`rgba(100,200,255,${(.12+hand.openness*.10).toFixed(2)})`);
    grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx2d.fillStyle=grd; ctx2d.beginPath(); ctx2d.arc(hand.cx,hand.cy,gr,0,Math.PI*2); ctx2d.fill();
  }
}

/* ── S2: 3D sphere shape builder ── */
function shapeSphere3D(){
  const a=[];
  for(let i=0;i<MAX_P;i++){
    const th=Math.random()*Math.PI*2;
    const ph=Math.acos(2*Math.random()-1);
    const r=S2_BASE_R*(0.78+Math.random()*0.44);
    a.push(Math.sin(ph)*Math.cos(th)*r, Math.sin(ph)*Math.sin(th)*r, Math.cos(ph)*r);
  }
  return new Float32Array(a);
}

/* ── S2: project photo ring into 3D sphere rotation space ── */
function updatePhotoPositions3D(){
  if(!photoEls.length) return;
  const N=photoEls.length;
  const ringR=S2_BASE_R*0.52*s2SphereScale;
  const cosX=Math.cos(s2RotX), sinX=Math.sin(s2RotX);
  const cosY=Math.cos(s2RotY), sinY=Math.sin(s2RotY);
  const v=new THREE.Vector3();

  photoEls.forEach((el,i)=>{
    const a=(i/N)*Math.PI*2;
    /* start in XZ equatorial plane */
    let lx=Math.cos(a)*ringR, ly=0, lz=Math.sin(a)*ringR;
    /* rotY (yaw) */
    const rx=lx*cosY+lz*sinY; const rz0=-lx*sinY+lz*cosY;
    lx=rx; lz=rz0;
    /* rotX (pitch) */
    const ry=ly*cosX-lz*sinX; const rz1=ly*sinX+lz*cosX;
    ly=ry; lz=rz1;
    /* project 3D→screen via camera */
    v.set(lx,ly,lz); v.project(camera3);
    const sx=(v.x+1)/2*innerWidth;
    const sy=(-v.y+1)/2*innerHeight;
    /* depth: NDC z ∈[-1,1] → 0(near)..1(far) */
    const depth=Math.max(0,Math.min(1,(v.z+1)/2));
    const sc=Math.max(0.40, 1.05-depth*0.65);
    const alpha=Math.max(0, 1.1-depth*0.75);
    el.style.left =(sx-57.5)+'px';
    el.style.top  =(sy-76  )+'px';
    el.style.opacity=alpha.toFixed(2);
    el.style.transform=`scale(${sc.toFixed(2)})`;
    el.style.zIndex=Math.floor((1-depth)*60)+1;
  });
}

async function enterS2(){
  state='S2'; hideAllUI(); useGL();
  /* reset sphere state */
  s2RotX=0; s2RotY=0; s2RotVelX=0; s2RotVelY=0;
  s2PrevHX=handX; s2PrevHY=handY;
  s2SphereScale=1.0; s2TargetScale=1.0;
  pts.rotation.set(0,0,0); pts.scale.setScalar(1.0);
  bloom.strength=2.15; pMat.size=0.080;
  /* aurora sphere colours */
  colorize(i=>{
    const hue=(i/MAX_P*360*2.618+Math.random()*60)%360;
    const r=0.35+0.65*Math.max(0,Math.cos(hue*Math.PI/180));
    const g=0.35+0.65*Math.max(0,Math.cos((hue-120)*Math.PI/180));
    const b=0.35+0.65*Math.max(0,Math.cos((hue-240)*Math.PI/180));
    const v=0.65+Math.random()*0.35;
    return[r*v,g*v,b*v];
  });
  /* animate in: scatter → sphere */
  setTarget(fill(shapeExplode(8)),LERP_FAST); await sleep(350);
  setTarget(shapeSphere3D(), LERP_MED);
  /* build photo ring */
  buildPhotoRing();
  $photoRing.style.display='block';
  photoEls.forEach(el=>{ el.style.transition='opacity .7s'; el.style.opacity='0'; });
  await sleep(700);
  photoEls.forEach(el=>el.style.opacity='1');
  $s2UI.classList.remove('hidden');
}

/* ═══════════════════════════════════════════════════════════════════
   S3: FIREWORKS SHOW + HAPPY BIRTHDAY  (2D canvas)
   ═══════════════════════════════════════════════════════════════════ */
let s3FWList=[], s3SparkList=[], s3Tick3=0, s3LaunchTimer=5;

function mkFirework(){
  const tx=innerWidth*(0.12+Math.random()*0.76);
  const ty=innerHeight*(0.06+Math.random()*0.44);
  const sx=innerWidth*(0.15+Math.random()*0.70);
  const dx=tx-sx, dy=ty-innerHeight;
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  const spd=10+Math.random()*7;
  const hue=Math.floor(Math.random()*360);
  return{x:sx,y:innerHeight,vx:dx/len*spd,vy:dy/len*spd,tx,ty,hue,trail:[],done:false};
}

function explodeFirework(fw){
  const cnt=100+Math.floor(Math.random()*70);
  for(let i=0;i<cnt;i++){
    const a=(i/cnt)*Math.PI*2+Math.random()*0.25;
    const spd=1.8+Math.random()*6.5;
    const hue2=(fw.hue+(Math.random()-0.5)*50+360)%360;
    s3SparkList.push({
      x:fw.x,y:fw.y,
      vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      hue:hue2,alpha:1,
      size:1.4+Math.random()*2.8,
      decay:0.009+Math.random()*0.013
    });
  }
  /* golden shimmer ring */
  const ring=30+Math.floor(Math.random()*20);
  for(let i=0;i<ring;i++){
    const a=(i/ring)*Math.PI*2;
    const spd=7+Math.random()*4;
    s3SparkList.push({x:fw.x,y:fw.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      hue:45+Math.random()*25,alpha:0.9,size:2+Math.random()*1.5,decay:0.018+Math.random()*0.012});
  }
}

function s3Animate(){
  s3AnimId2=requestAnimationFrame(s3Animate);
  const W=innerWidth,H=innerHeight;
  s3Tick3++;

  ctx2d.fillStyle='rgba(0,0,0,0.16)';
  ctx2d.fillRect(0,0,W,H);

  /* launch new fireworks */
  s3LaunchTimer--;
  if(s3LaunchTimer<=0){
    s3FWList.push(mkFirework());
    if(s3Tick3>90) s3FWList.push(mkFirework());
    if(s3Tick3>200&&Math.random()<0.3) s3FWList.push(mkFirework());
    s3LaunchTimer=22+Math.floor(Math.random()*20);
  }
  /* hand-triggered burst */
  if(hand.detected&&fwThrottle<=0){
    const fw=mkFirework();
    fw.x=hand.cx; fw.tx=hand.cx+(Math.random()-0.5)*120;
    fw.ty=hand.cy*(0.3+Math.random()*0.5);
    s3FWList.push(fw);
    fwThrottle=30;
  }
  if(fwThrottle>0) fwThrottle--;

  /* update & draw rockets */
  s3FWList=s3FWList.filter(fw=>{
    if(fw.done) return false;
    fw.trail.push({x:fw.x,y:fw.y});
    if(fw.trail.length>12) fw.trail.shift();
    fw.x+=fw.vx; fw.y+=fw.vy;
    fw.vy+=0.20;
    if(fw.vy>=0||Math.hypot(fw.x-fw.tx,fw.y-fw.ty)<22){
      explodeFirework(fw); fw.done=true; return false;
    }
    for(let i=0;i<fw.trail.length;i++){
      const a=(i/fw.trail.length)*0.75;
      ctx2d.beginPath(); ctx2d.arc(fw.trail[i].x,fw.trail[i].y,2,0,Math.PI*2);
      ctx2d.fillStyle=`hsla(${fw.hue},100%,78%,${a})`; ctx2d.fill();
    }
    ctx2d.beginPath(); ctx2d.arc(fw.x,fw.y,3.5,0,Math.PI*2);
    ctx2d.fillStyle=`hsl(${fw.hue},100%,92%)`; ctx2d.fill();
    return true;
  });

  /* update & draw sparks */
  s3SparkList=s3SparkList.filter(sp=>{
    sp.x+=sp.vx; sp.y+=sp.vy;
    sp.vy+=0.06; sp.vx*=0.97; sp.vy*=0.97;
    sp.alpha-=sp.decay;
    if(sp.alpha<=0) return false;
    ctx2d.beginPath(); ctx2d.arc(sp.x,sp.y,sp.size*Math.max(0,sp.alpha),0,Math.PI*2);
    ctx2d.fillStyle=`hsla(${sp.hue},100%,70%,${sp.alpha.toFixed(2)})`; ctx2d.fill();
    return true;
  });

  /* ── Happy Birthday text ── */
  const pulse=0.78+Math.sin(s3Tick3*0.045)*0.22;
  const hueShift=(s3Tick3*1.4)%360;
  const fs=Math.min(W*0.105,82);
  ctx2d.save();
  ctx2d.textAlign='center';
  ctx2d.textBaseline='middle';
  ctx2d.font=`900 ${fs}px 'Noto Sans SC',sans-serif`;

  /* outer glow layers */
  for(let g=3;g>=0;g--){
    ctx2d.shadowBlur=20+g*18;
    ctx2d.shadowColor=`hsla(${(hueShift+g*45)%360},100%,65%,${(pulse*(0.55-g*0.10)).toFixed(2)})`;
    const grad=ctx2d.createLinearGradient(W/2-W*0.28,0,W/2+W*0.28,0);
    grad.addColorStop(0,  `hsl(${hueShift%360},100%,80%)`);
    grad.addColorStop(0.33,`hsl(${(hueShift+110)%360},100%,88%)`);
    grad.addColorStop(0.66,`hsl(${(hueShift+220)%360},100%,80%)`);
    grad.addColorStop(1,  `hsl(${hueShift%360},100%,80%)`);
    ctx2d.fillStyle=grad;
    ctx2d.fillText('Happy Birthday', W/2, H/2);
  }
  ctx2d.shadowBlur=0;
  ctx2d.restore();

  /* sparkle stars around text */
  if(s3Tick3%4===0){
    const tx2=W/2+(Math.random()-0.5)*W*0.48;
    const ty2=H/2+(Math.random()-0.5)*fs*1.8;
    s3SparkList.push({x:tx2,y:ty2,vx:(Math.random()-0.5)*2,vy:-1-Math.random()*2,
      hue:(hueShift+Math.random()*60)%360,alpha:1,size:3,decay:0.025});
  }
}

async function enterS3(){
  state='S3'; hideAllUI(); use2D();
  if(s2AnimId){ cancelAnimationFrame(s2AnimId); s2AnimId=null; }
  ctx2d.clearRect(0,0,innerWidth,innerHeight);
  s3FWList=[]; s3SparkList=[]; s3Tick3=0; s3LaunchTimer=5; fwThrottle=0;
  $s3UI.classList.remove('hidden');
  s3Animate();
}

/* ═══════════════════════════════════════════════════════════════════
   THREE.JS RENDER LOOP  (PHASE0 / S1 / S3)
   ═══════════════════════════════════════════════════════════════════ */
function glTick(){
  requestAnimationFrame(glTick);
  if($glCanvas.style.display==='none') return;   // pause while S2 is active

  /* Particle lerp / burst */
  for(let i=0;i<MAX_P;i++){
    const i3=i*3;
    if(burst[i]){
      velArr[i3]*=.968; velArr[i3+1]-=.007; velArr[i3+2]*=.968;
      posArr[i3]+=velArr[i3]; posArr[i3+1]+=velArr[i3+1]; posArr[i3+2]+=velArr[i3+2];
      if(Math.abs(velArr[i3])<.001&&Math.abs(velArr[i3+1])<.005&&Math.abs(velArr[i3+2])<.001) burst[i]=0;
    } else {
      posArr[i3]+=(tgtArr[i3]-posArr[i3])*lerpSpd;
      posArr[i3+1]+=(tgtArr[i3+1]-posArr[i3+1])*lerpSpd;
      posArr[i3+2]+=(tgtArr[i3+2]-posArr[i3+2])*lerpSpd;
    }
  }
  posAttr.needsUpdate=true;

  if(state==='PHASE0'){
    pts.rotation.y+=(0-pts.rotation.y)*.06;
    pts.rotation.x+=(0-pts.rotation.x)*.06;
  } else if(state==='S1'){
    s1RotTarget=(handX-.5)*Math.PI*3;
    s1AutoRot+=(s1RotTarget-s1AutoRot)*.04;
    pts.rotation.y=s1AutoRot;
  } else if(state==='S2'){
    /* hand openness → sphere scale (fist≈0.42×, open palm≈1.9×) */
    s2TargetScale=0.42+hand.openness*1.48;
    s2SphereScale+=(s2TargetScale-s2SphereScale)*0.09;
    pts.scale.setScalar(s2SphereScale);
    /* hand movement → rotation velocity */
    if(hand.detected){
      s2RotVelY+=(handX-s2PrevHX)*5.8;
      s2RotVelX+=(handY-s2PrevHY)*3.2;
    }
    s2PrevHX=handX; s2PrevHY=handY;
    s2RotVelX*=0.90; s2RotVelY*=0.90;
    /* auto-spin when no hand */
    if(!hand.detected) s2RotY+=0.007;
    s2RotX+=s2RotVelX; s2RotY+=s2RotVelY;
    /* clamp tilt to avoid flipping */
    s2RotX=Math.max(-Math.PI*0.42,Math.min(Math.PI*0.42,s2RotX));
    pts.rotation.x=s2RotX; pts.rotation.y=s2RotY;
    /* recolour sphere: throttled to every ~20 frames for performance */
    if(!window._s2cf) window._s2cf=0;
    if(++window._s2cf%20===0){
      const shift=performance.now()*0.008;
      colorize(i=>{
        const hue=(i/MAX_P*360*2.618+shift)%360;
        const r=0.30+0.70*Math.max(0,Math.cos(hue*Math.PI/180));
        const g=0.30+0.70*Math.max(0,Math.cos((hue-120)*Math.PI/180));
        const b=0.30+0.70*Math.max(0,Math.cos((hue-240)*Math.PI/180));
        const v=0.65+Math.random()*0.35;
        return[r*v,g*v,b*v];
      });
    }
    updatePhotoPositions3D();
  } else if(state==='S3'){
    pts.rotation.y+=.0018;
    /* S3 hand→fireworks (cursor drives burst) */
    if(hand.detected && fwThrottle<=0){
      colCelebrate(); scatter3D(); fwThrottle=55;
      setTimeout(()=>{ colCelebrate(); setTarget(tgtArr.slice(),LERP_SLOW); },900);
    }
    if(fwThrottle>0) fwThrottle--;
  }

  camera3.lookAt(0,0,0);
  composer.render();
}
glTick();

/* ═══════════════════════════════════════════════════════════════════
   MEDIAPIPE  —  shared hand tracking
   ═══════════════════════════════════════════════════════════════════ */
async function initMP(){
  if(typeof window.Hands==='undefined') throw new Error('Hands not loaded');
  loaderStep(2); setLoaderBar(25);
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'},audio:false});
  }catch(e){throw new Error('Camera denied: '+e.message);}
  $webcam.srcObject=stream; $webcam.muted=true;
  await new Promise((res,rej)=>{ $webcam.onloadeddata=res; $webcam.onerror=rej; setTimeout(()=>rej(new Error('timeout')),10000); });
  $webcam.play().catch(()=>{});
  loaderStep(2,true); setLoaderBar(45);

  loaderStep(3); setLoaderTip('正在下载 AI 模型（约 6 MB）…');
  const handsM=new window.Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
  handsM.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:0.6,minTrackingConfidence:0.5});
  handsM.onResults(results=>{
    if(!results.multiHandLandmarks?.length){ hand.detected=false; hand.angleDelta=0; return; }
    const lms=results.multiHandLandmarks[0];
    updateHandFromLM(lms);
    /* Pinch */
    const thm=lms[4],tip=lms[8];
    const dd=Math.hypot(thm.x-tip.x,thm.y-tip.y,thm.z-tip.z);
    const pinching=dd<0.07;
    if(pinching)$cursor.classList.add('pinching'); else $cursor.classList.remove('pinching');
    if(pinching&&!isPinching&&pinchCooldown<=0){isPinching=true;pinchCooldown=52;onPinch();}
    if(!pinching)isPinching=false;
    if(pinchCooldown>0)pinchCooldown--;
    /* S1: map hand X to 3D space for hit-plane */
    if(state==='S1') mouse3.set(handX*2-1,-(handY*2-1));
  });

  let fp=45; const fb=setInterval(()=>{fp=Math.min(fp+(90-fp)*.06,90);setLoaderBar(fp);},300);
  await handsM.initialize();
  clearInterval(fb); loaderStep(3,true); setLoaderBar(95);

  let pumpOn=true;
  (async function pump(){
    if(!pumpOn)return;
    if($webcam.readyState>=HTMLMediaElement.HAVE_CURRENT_DATA) try{await handsM.send({image:$webcam});}catch(_){}
    requestAnimationFrame(pump);
  })();
}

/* ── Mouse fallback ── */
window.addEventListener('mousemove',e=>{
  if(!mouseMode)return;
  const prevX=handX;
  handX=e.clientX/innerWidth; handY=e.clientY/innerHeight;
  $cursor.style.left=e.clientX+'px'; $cursor.style.top=e.clientY+'px';
  hand.cx=e.clientX; hand.cy=e.clientY; hand.detected=true;
  mouse3.set(handX*2-1,-(handY*2-1));
  if(state==='S2'){ hand.openness=Math.min(1,hand.openness+.018); }
  if(state==='S3') hand.openness=0.8;
});
window.addEventListener('click',e=>{ if(!mouseMode||transitioning)return; onPinch(); });

/* ── Resize ── */
window.addEventListener('resize',()=>{
  camera3.aspect=innerWidth/innerHeight; camera3.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  bloom.setSize(innerWidth,innerHeight); resizeP2D();
  if(state==='S2') updatePhotoPositions3D();
});

   ═══════════════════════════════════════════════════════════════════ */
const $loaderCard=document.getElementById('loader-card');
const $loaderBar=document.getElementById('loader-bar');
const $loaderTip=document.getElementById('loader-tip');
const TIPS=['首次加载需下载 ~6 MB AI 模型','模型下载后将缓存到本地','张开手掌控制粒子','移动手掌旋转星球','稍等片刻，星光即将绽放…'];
let tipIdx=0,tipTimer=null;
function loaderShow(){ $loaderCard.classList.add('visible'); tipTimer=setInterval(()=>{tipIdx=(tipIdx+1)%TIPS.length;setLoaderTip(TIPS[tipIdx]);},2800); }
function loaderHide(){ clearInterval(tipTimer); $loaderCard.classList.remove('visible'); }
function setLoaderTip(t){ $loaderTip.textContent=t; }
function setLoaderBar(pct){ $loaderBar.style.width=pct+'%'; }
function loaderStep(n,done=false){
  for(let i=1;i<=4;i++){
    const el=document.getElementById('step-'+i),icon=document.getElementById('step-'+i+'-icon');
    if(i<n){el.className='loader-step done';icon.textContent='✓';}
    else if(i===n){el.className=done?'loader-step done':'loader-step active';icon.textContent=done?'✓':i;}
    else{el.className='loader-step';icon.textContent=i;}
  }
}

/* ═══════════════════════════════════════════════════════════════════
   START
   ═══════════════════════════════════════════════════════════════════ */
$startBtn.addEventListener('click',async()=>{
  $startBtn.disabled=true; $startBtn.textContent='准备中…';
  loaderShow();
  loaderStep(1); setLoaderBar(10);
  await sleep(60);
  buildDigitShapes();
  await sleep(0);
  loaderStep(1,true); setLoaderBar(20);

  try{
    await initMP();
    $cursor.style.display='block';
    loaderStep(4); setLoaderBar(100); setLoaderTip('🎉 准备完毕！倒计时即将开始…');
  }catch(err){
    console.warn('MP failed:',err);
    mouseMode=true; $cursor.style.display='block';
    loaderStep(3,true); setLoaderBar(100); setLoaderTip('⚠️ 摄像头不可用，已切换为鼠标控制');
  }

  await sleep(800);
  gsap.to($landing,{opacity:0,duration:.7,onComplete:()=>$landing.classList.add('hidden')});
  loaderHide();
  await sleep(900);
  await runPhase0();
});
